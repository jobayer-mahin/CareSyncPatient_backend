# Application Info
spring.application.name=CareSync-HMS
server.port=3000

# =============================================
# MySQL Database (XAMPP MariaDB)
# The database itself is created by database/00_create_database.sql,
# so createDatabaseIfNotExist is intentionally left off here to avoid
# two different things (this file and the SQL script) both trying to
# own database creation.
# Override any of these with environment variables in real deployments;
# the values after ':' below are local-dev defaults only.
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/caresync_hms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Dhaka
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
# ddl-auto=none: the schema is owned by database/01_schema_patient.sql (run it
# yourself before starting the app). Letting Hibernate auto-alter a hand-written,
# FK-heavy schema is what causes silent drift between the SQL files and the DB.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
# CHANGE_ME_IN_PRODUCTION is a placeholder only - set the real secret via the
# JWT_SECRET environment variable (never commit a real secret to this file).
jwt.secret=${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_this-is-a-placeholder-not-a-real-secret}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration (Frontend URLs)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging (kept at INFO by default; override for local debugging)
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:INFO}
logging.level.com.caresync.hms=${APP_LOG_LEVEL:INFO}
